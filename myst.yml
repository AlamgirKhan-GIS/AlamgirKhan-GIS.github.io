version: 1
project:
  title: Mohammad Alamgir Khan
  description: SAR/InSAR, GeoAI and geospatial modelling for humanitarian and environmental Earth observation
  keywords:
    - SAR
    - InSAR
    - Sentinel-1
    - Remote Sensing
    - GIS
    - GeoAI
    - Change Detection
  authors:
    - name: Mohammad Alamgir Khan
      affiliations:
        - LIESMARS, Wuhan University
      github: AlamgirKhan-GIS
  copyright: '2026'
  github: AlamgirKhan-GIS/AlamgirKhan-GIS.github.io
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - generate_rss.py
    - inject_comments.py
    - rss.xml
    - atom.xml
    - CONDUCT.md
    - CONTRIBUTING.md
    - README.md
    - LICENSE
  bibliography:
    - pages/references.bib
  toc:
    - file: index.md
    - file: pages/about.md
    - file: pages/research/index.md
      children:
        - file: pages/research/gaza-ccd.md
        - file: pages/research/shisper-glacier.md
    - file: pages/figures.md
    - file: pages/presentations.md
    - file: pages/skills.md
    - file: pages/certificates.md
    - file: pages/cv.md
    - file: blog.md
      children:
        - file: tags/myst-markdown.md
        - file: tags/tutorial.md
        - file: tags/github-pages.md
    - pattern: posts/*.md
      hidden: true
site:
  options:
    logo: logo.png
    logo_dark: logo.png
    favicon: fav.ico
    folders: true
    style: custom.css
  actions:
    - title: RSS
      url: https://alamgirkhan-gis.github.io/rss.xml
  template: book-theme
  parts:
    primary_sidebar_footer: ''